<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker - Portofolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300 min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-blue-600 dark:text-blue-400 flex items-center">
            <i class="fas fa-briefcase mr-2"></i>JobTracker
        </h1>
        <div class="flex items-center gap-4">
            <button id="loginBtn" class="border border-gray-300 hover:bg-gray-100 dark:border-gray-600 dark:hover:bg-gray-700 text-sm font-medium px-4 py-2 rounded-lg transition flex items-center shadow-sm">
                <i class="fab fa-google text-red-500 mr-2"></i>Login Google
            </button>
            <div id="userInfo" class="hidden items-center gap-3">
                <img id="userPhoto" src="" class="w-8 h-8 rounded-full border border-gray-300">
                <span id="userName" class="text-sm font-semibold hidden md:block"></span>
                <button id="logoutBtn" class="text-red-500 hover:text-red-700 text-sm px-2 py-1 transition"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <button id="themeToggle" class="text-gray-600 dark:text-gray-300 hover:text-blue-500 transition"><i class="fas fa-moon text-xl"></i></button>
        </div>
    </nav>

    <!-- Error Banner (Akan muncul jika ada masalah) -->
    <div id="errorBanner" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 m-4 rounded shadow-sm relative">
        <h3 class="font-bold text-lg"><i class="fas fa-exclamation-circle mr-2"></i>Terjadi Kesalahan Sistem</h3>
        <p id="errorMessage" class="text-sm mt-1"></p>
        <button onclick="document.getElementById('errorBanner').classList.add('hidden')" class="absolute top-2 right-2 text-red-500 hover:text-red-800"><i class="fas fa-times"></i></button>
    </div>

    <div class="container mx-auto p-4 max-w-5xl mt-2">
        
        <!-- Formulir Tambah Data -->
        <div id="formContainer" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 mb-8 border border-gray-200 dark:border-gray-700">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2 dark:border-gray-700">Tambah Lamaran Baru</h2>
            <form id="jobForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Perusahaan *</label>
                    <input type="text" id="company" required class="w-full border rounded-lg p-2 bg-gray-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Posisi *</label>
                    <input type="text" id="position" required class="w-full border rounded-lg p-2 bg-gray-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Status</label>
                    <select id="status" class="w-full border rounded-lg p-2 bg-gray-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none">
                        <option value="Terkirim">Terkirim</option>
                        <option value="Proses Interview">Proses Interview</option>
                        <option value="Diterima">Diterima</option>
                        <option value="Ditolak">Ditolak</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Tanggal</label>
                    <input type="date" id="date" required class="w-full border rounded-lg p-2 bg-gray-50 dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none">
                </div>
                <div class="md:col-span-2 pt-2 flex gap-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm w-full md:w-auto"><i class="fas fa-save mr-2"></i>Simpan</button>
                </div>
            </form>
        </div>

        <!-- Dashboard Ringkasan -->
        <h2 class="text-lg font-semibold mb-3">Ringkasan Lamaran</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm"><p class="text-sm text-gray-500 mb-1">Total Dilamar</p><h3 id="statTotal" class="text-3xl font-bold">0</h3></div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm"><p class="text-sm text-blue-500 mb-1">Proses Interview</p><h3 id="statInterview" class="text-3xl font-bold text-blue-600">0</h3></div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm"><p class="text-sm text-green-500 mb-1">Diterima</p><h3 id="statDiterima" class="text-3xl font-bold text-green-600">0</h3></div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm"><p class="text-sm text-red-500 mb-1">Ditolak</p><h3 id="statDitolak" class="text-3xl font-bold text-red-600">0</h3></div>
        </div>

        <!-- Tabel Data -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-3">
            <h2 class="text-lg font-semibold mb-2 md:mb-0">Daftar Lowongan</h2>
            <div id="loadingIndicator" class="text-blue-500 text-sm hidden font-medium"><i class="fas fa-spinner fa-spin mr-1"></i> Memuat data...</div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-sm border-b dark:border-gray-700">
                            <th class="p-4 font-semibold">Perusahaan</th>
                            <th class="p-4 font-semibold">Posisi</th>
                            <th class="p-4 font-semibold">Tanggal</th>
                            <th class="p-4 font-semibold">Status</th>
                            <th class="p-4 font-semibold text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="jobList" class="divide-y divide-gray-100 dark:divide-gray-700">
                    </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="p-12 text-center hidden">
                <i class="fas fa-folder-open text-5xl mb-4 text-gray-300 dark:text-gray-600"></i>
                <p class="text-gray-500 font-medium">Belum ada data</p>
                <p class="text-sm text-gray-400 mt-1 mb-4">Mulai melacak perjalanan karir Anda.</p>
            </div>
        </div>
    </div>

    <!-- Toast Notifikasi -->
    <div id="toastContainer" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // KUNCI ASLI MILIK ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyD_vmv82okTt_Clpkgd9oPA1hlrGitWDuo",
            authDomain: "job-tracker-d664b.firebaseapp.com",
            projectId: "job-tracker-d664b",
            storageBucket: "job-tracker-d664b.firebasestorage.app",
            messagingSenderId: "207506154246",
            appId: "1:207506154246:web:0761f44f2ffcf2bf117487"
        };

        let app, db, auth, provider;
        
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch (error) {
            showError("Gagal menginisiasi Firebase: " + error.message);
        }

        let currentUser = null;
        let unsubscribeSnapshot = null;

        // Elemen HTML
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfo = document.getElementById('userInfo');
        const jobList = document.getElementById('jobList');
        const emptyState = document.getElementById('emptyState');
        const jobForm = document.getElementById('jobForm');
        document.getElementById('date').valueAsDate = new Date();

        // Dark Mode
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        if(localStorage.getItem('theme') === 'dark') html.classList.add('dark');
        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        function showToast(title, message, type="success") {
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'fa-check-circle text-green-500' : 'fa-exclamation-triangle text-yellow-500';
            toast.className = `bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-lg rounded-lg p-4 flex items-start gap-3 w-80 transform transition-all duration-300 translate-y-0 opacity-100`;
            toast.innerHTML = `<i class="fas ${icon} mt-1"></i><div><h4 class="font-bold text-sm text-gray-800 dark:text-white">${title}</h4><p class="text-xs text-gray-500 dark:text-gray-400">${message}</p></div>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            const msgEl = document.getElementById('errorMessage');
            banner.classList.remove('hidden');
            msgEl.innerText = msg;
        }

        // TANGKAP HASIL REDIRECT GOOGLE
        if (auth) {
            getRedirectResult(auth).then((result) => {
                if (result) {
                    showToast("Login Berhasil", "Selamat datang kembali!", "success");
                }
            }).catch((error) => {
                showError("Gagal memproses login: " + error.message);
            });

            // TOMBOL LOGIN
            loginBtn.addEventListener('click', () => {
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Mengalihkan...';
                loginBtn.disabled = true;
                signInWithRedirect(auth, provider).catch(err => {
                    showError("Error saat mengalihkan: " + err.message);
                    loginBtn.innerHTML = '<i class="fab fa-google text-red-500 mr-2"></i>Login Google';
                    loginBtn.disabled = false;
                });
            });

            // TOMBOL LOGOUT
            logoutBtn.addEventListener('click', () => {
                if(confirm("Yakin ingin keluar dari akun Google?")) {
                    signOut(auth).then(() => window.location.reload());
                }
            });

            // PANTAU STATUS PENGGUNA
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    if(!user.isAnonymous){
                        loginBtn.classList.add('hidden');
                        userInfo.classList.remove('hidden');
                        userInfo.classList.add('flex');
                        document.getElementById('userName').innerText = user.displayName;
                        document.getElementById('userPhoto').src = user.photoURL;
                    } else {
                        loginBtn.classList.remove('hidden');
                        userInfo.classList.add('hidden');
                        userInfo.classList.remove('flex');
                    }
                    loadData();
                } else {
                    signInAnonymously(auth).catch(err => showError("Gagal akses mode tamu: " + err.message));
                }
            });
        }

        // TARIK DATA DARI DATABASE
        function loadData() {
            if(!currentUser) return;
            document.getElementById('loadingIndicator').classList.remove('hidden');
            const q = query(collection(db, `users/${currentUser.uid}/jobs`), orderBy('createdAt', 'desc'));
            
            if(unsubscribeSnapshot) unsubscribeSnapshot();
            
            try {
                unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                    document.getElementById('loadingIndicator').classList.add('hidden');
                    jobList.innerHTML = '';
                    let total=0, interview=0, diterima=0, ditolak=0;

                    if (snapshot.empty) {
                        emptyState.classList.remove('hidden');
                        emptyState.classList.add('block');
                    } else {
                        emptyState.classList.add('hidden');
                        emptyState.classList.remove('block');
                        
                        snapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            total++;
                            if(data.status === 'Proses Interview') interview++;
                            if(data.status === 'Diterima') diterima++;
                            if(data.status === 'Ditolak') ditolak++;
                            renderRow(docSnap.id, data);
                        });
                    }
                    
                    document.getElementById('statTotal').innerText = total;
                    document.getElementById('statInterview').innerText = interview;
                    document.getElementById('statDiterima').innerText = diterima;
                    document.getElementById('statDitolak').innerText = ditolak;
                }, (error) => {
                    showError("Gagal menarik data dari server: " + error.message);
                });
            } catch(e) {
                showError(e.message);
            }
        }

        // TAMPILKAN BARIS TABEL
        function renderRow(id, data) {
            let color = 'bg-gray-100 text-gray-800';
            if(data.status === 'Terkirim') color = 'bg-blue-100 text-blue-800';
            if(data.status === 'Proses Interview') color = 'bg-yellow-100 text-yellow-800';
            if(data.status === 'Diterima') color = 'bg-green-100 text-green-800';
            if(data.status === 'Ditolak') color = 'bg-red-100 text-red-800';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-4 font-medium">${data.company}</td>
                <td class="p-4 text-gray-600 dark:text-gray-400">${data.position}</td>
                <td class="p-4">${data.date}</td>
                <td class="p-4"><span class="px-3 py-1 text-xs font-bold rounded-full ${color}">${data.status}</span></td>
                <td class="p-4 text-center">
                    <button class="delete-btn text-gray-400 hover:text-red-500 transition" data-id="${id}"><i class="fas fa-trash"></i></button>
                </td>
            `;
            jobList.appendChild(tr);

            tr.querySelector('.delete-btn').addEventListener('click', async (e) => {
                if(confirm('Hapus lamaran di perusahaan ini?')) {
                    try {
                        await deleteDoc(doc(db, `users/${currentUser.uid}/jobs`, id));
                        showToast("Terhapus", "Data berhasil dihapus.", "success");
                    } catch(err) {
                        showError("Gagal menghapus: " + err.message);
                    }
                }
            });
        }

        // SIMPAN DATA KE FIREBASE
        jobForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;
            const btn = jobForm.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...';
            btn.disabled = true;
            
            try {
                await addDoc(collection(db, `users/${currentUser.uid}/jobs`), {
                    company: document.getElementById('company').value,
                    position: document.getElementById('position').value,
                    status: document.getElementById('status').value,
                    date: document.getElementById('date').value,
                    createdAt: serverTimestamp()
                });
                jobForm.reset();
                document.getElementById('date').valueAsDate = new Date();
                showToast("Berhasil", "Lamaran baru telah ditambahkan.", "success");
            } catch (error) {
                showError("Gagal menyimpan data: " + error.message);
            } finally {
                btn.innerHTML = '<i class="fas fa-save mr-2"></i>Simpan';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
